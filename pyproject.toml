[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoscaffold-lab"
version = "0.1.0"
description = "AutoScaffold: teacher-designed training-time scaffolds for RLVR (CPU-only NumPy reproduction)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
